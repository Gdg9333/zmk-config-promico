name: Build ZMK Firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install west + dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip \
            python3-setuptools \
            ninja-build \
            cmake \
            dfu-util \
            device-tree-compiler
          pip3 install --user west

      - name: Initialize west workspace
        run: |
          west init -l config
          west update
          west zephyr-export

      - name: Build left
        run: |
          west build \
            -d build/left \
            -s zmk/app \
            -b nice_nano_v2 \
            -- \
            -DSHIELD=promicro_left \
            -DZMK_CONFIG=$PWD/config

      - name: Build right
        run: |
          west build \
            -d build/right \
            -s zmk/app \
            -b nice_nano_v2 \
            -- \
            -DSHIELD=promicro_right \
            -DZMK_CONFIG=$PWD/config

      - name: Build settings reset
        run: |
          west build \
            -d build/reset \
            -s zmk/app \
            -b nice_nano_v2 \
            -- \
            -DSHIELD=settings_reset \
            -DZMK_CONFIG=$PWD/config

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/left/zephyr/*.uf2
            build/right/zephyr/*.uf2
            build/reset/zephyr/*.uf2
