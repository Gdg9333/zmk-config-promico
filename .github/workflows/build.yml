name: Build ZMK Firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.0
        with:
          fetch-depth: 0

      - name: Install west + dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-setuptools ninja-build
          pip3 install --user west

      - name: Initialize west workspace
        run: |
          west init -l .
          west update

      - name: Build (left)
        run: |
          west build -s zmk/app -b promicro -- -DSHIELD=promicro_left

      - name: Build (right)
        run: |
          west build -s zmk/app -b promicro -- -DSHIELD=promicro_right

      - name: Build (settings reset)
        run: |
          west build -s zmk/app -b promicro -- -DSHIELD=settings_reset

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/zephyr/*.uf2
